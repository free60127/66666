<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f4f6f8; color: #1c2733; height: 100vh; overflow: hidden; }
.app { display: flex; height: 100vh; }
.sidebar { width: 240px; min-width: 240px; background: #10222e; color: #dfe9f0; display: flex; flex-direction: column; padding: 16px 12px; gap: 14px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px; }
.brand-mark { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #2aa7ff, #1164d8); display: grid; place-items: center; font-weight: 700; color: #fff; }
.brand strong { display: block; font-size: 16px; }
.brand span { font-size: 9px; color: #8fa6b5; letter-spacing: .08em; }
.new-btn { background: #1f6feb; color: #fff; padding: 10px; border-radius: 10px; font-weight: 600; text-align: center; font-size: 14px; }
.side-label { font-size: 10px; letter-spacing: .12em; color: #7f99aa; padding: 4px 6px; }
.book-tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin: 0 2px 8px; }
.book-tabs div { border: 1px solid #3a4f5e; border-radius: 7px; color: #a9bdc9; padding: 5px 2px; font-size: 11px; text-align: center; }
.book-tabs div.on { background: #2d81d7; border-color: #2d81d7; color: #fff; }
.lesson-list { overflow: hidden; display: flex; flex-direction: column; gap: 2px; }
.lesson-item { display: flex; gap: 8px; padding: 7px 8px; border-radius: 8px; color: #c7d6df; font-size: 12.5px; }
.lesson-item .no { color: #6f8b9c; width: 18px; font-size: 11px; }
.lesson-item.on { background: rgba(66,150,255,.18); color: #fff; }
.side-footer { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.side-footer div { border: 1px solid #3a4f5e; border-radius: 9px; padding: 8px 0; text-align: center; font-size: 12.5px; color: #b9cad6; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { height: 52px; min-height: 52px; background: #fff; border-bottom: 1px solid #e6eaf0; display: flex; align-items: center; gap: 10px; padding: 0 16px; }
.topbar .title { font-weight: 600; font-size: 15px; }
.status-dot { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #74808d; }
.status-dot i { width: 8px; height: 8px; border-radius: 50%; background: #2f9e44; }
.kebab { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: #74808d; font-weight: 700; letter-spacing: 1px; }

/* 步骤进度条 */
.steps { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 18px 0 6px; }
.step { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #9aa6b1; }
.step .n { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #d7dee6; display: grid; place-items: center; font-weight: 700; font-size: 12.5px; background: #fff; }
.step.done .n { border-color: #0f9d8f; background: #0f9d8f; color: #fff; }
.step.done { color: #4a5561; }
.step.on .n { border-color: #1f6feb; background: #1f6feb; color: #fff; }
.step.on { color: #1c2733; font-weight: 600; }
.step-line { width: 46px; height: 2px; background: #d7dee6; }
.step-line.done { background: #0f9d8f; }

.wizard { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 10px 24px 0; max-width: 900px; width: 100%; margin: 0 auto; gap: 12px; }

/* 已选材料摘要卡（第1步的结果，压缩成一行） */
.material { background: #fff; border: 1px solid #e6eaf0; border-radius: 12px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; font-size: 13px; }
.material .tag { background: #e8f0fb; color: #1f6feb; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 600; }
.material .chg { margin-left: auto; color: #1f6feb; font-size: 12.5px; }
.material .peek { color: #74808d; font-size: 12.5px; border-left: 1px solid #e6eaf0; padding-left: 10px; }

.write-panel { background: #fff; border: 1px solid #e6eaf0; border-radius: 14px; padding: 14px; flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.write-head { display: flex; align-items: center; gap: 8px; }
.write-head h2 { font-size: 15px; margin-right: auto; }
.icon-btn { border: 1px solid #e6eaf0; border-radius: 7px; font-size: 12px; color: #74808d; padding: 4px 8px; }
.write-panel textarea { flex: 1; border: 1px solid #e6eaf0; border-radius: 10px; padding: 12px; font: inherit; font-size: 14px; line-height: 1.9; resize: none; min-height: 0; }
.write-foot { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #9aa6b1; }
.write-foot .right { display: flex; gap: 10px; align-items: center; }

.wizard-actions { display: flex; gap: 12px; padding: 14px 0 18px; }
.back { border: 1px solid #d7dee6; background: #fff; border-radius: 12px; padding: 13px 26px; font-weight: 600; color: #4a5561; font-size: 14px; }
.next { flex: 1; background: #1f6feb; color: #fff; border-radius: 12px; padding: 13px 0; text-align: center; font-weight: 700; font-size: 15px; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">回</div><div><strong>回译本</strong><span>BACK-TRANSLATE STUDIO</span></div></div>
    <div class="new-btn">＋ 新建回译作业</div>
    <div class="side-label">课文库</div>
    <div class="book-tabs"><div>1</div><div class="on">2</div><div>3</div><div>4</div><div>…</div></div>
    <div class="lesson-list">
      <div class="lesson-item"><span class="no">03</span>请给我寄一张明信片</div>
      <div class="lesson-item"><span class="no">04</span>激动人心的旅行</div>
      <div class="lesson-item on"><span class="no">05</span>无错号之虞</div>
      <div class="lesson-item"><span class="no">06</span>珀西·巴顿斯</div>
      <div class="lesson-item"><span class="no">07</span>为时太晚</div>
      <div class="lesson-item"><span class="no">08</span>最好的和最差的</div>
    </div>
    <div class="side-footer"><div>⚙ AI 设置</div><div>⭳ 备份</div></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="title">课文回译训练</div>
      <div class="status-dot"><i></i>AI 已配置 · deepseek-chat</div>
      <div class="kebab">⋮</div>
    </div>
    <div class="steps">
      <div class="step done"><span class="n">✓</span>选择材料</div>
      <div class="step-line done"></div>
      <div class="step on"><span class="n">2</span>撰写初稿</div>
      <div class="step-line"></div>
      <div class="step"><span class="n">3</span>生成与批改</div>
    </div>
    <div class="wizard">
      <div class="material">
        <span class="tag">第 2 册 · Lesson 5</span> 无错号之虞
        <span class="peek">中文已带入 · 原文将逐句对照</span>
        <span class="chg">更换材料</span>
      </div>
      <div class="write-panel">
        <div class="write-head"><h2>写下你的英文回译</h2><span class="icon-btn">📷 拍照识别</span><span class="icon-btn">🖼 导入图片</span></div>
        <textarea placeholder="读上面的中文提示，用你自己的英文把它译回来。写完后点下方按钮，AI 会逐句批改。"></textarea>
        <div class="write-foot">
          <span>⏱ 已用 03:24 · 手写作文纸可拍照识别</span>
          <div class="right"><span>已写 86 词</span></div>
        </div>
      </div>
      <div class="wizard-actions">
        <div class="back">上一步</div>
        <div class="next">下一步 · 生成批改</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
