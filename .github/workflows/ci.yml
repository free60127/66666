# 每次 push / PR 都跑测试。
#
# 为什么单独一个 workflow：部署工作流（deploy-pages.yml）只在**前端文件**变化时触发，
# 而 server/ 、test/ 这些改动根本不经过它 —— 也就是说改后端可以完全绕过测试。
# 这里覆盖所有分支的所有改动，并在部署工作流里也加了一道（部署前必须先过测试）。
#
# 注意：真实浏览器 e2e（tools/e2e-b6b7.mjs）需要 playwright，CI 里不装（省时间），
# 所以那条链路目前只在本地跑；纯 node 的回归都在下面这几步里。
name: CI（测试）

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24：auth-worker 的 D1 本地垫片用 node:sqlite（需要 22.5+），
          # 用 20 会让 npm run test:auth 直接失败（CI 曾经因此红了一串提交）
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 静态检查放在测试前面：ESLint 的 no-undef / jsx-no-undef 能抓住「漏了 import」
      # 这类只在浏览器里才炸的白屏问题（曾经带着这种提交上线过），
      # check-hook-scope 再抓一层「hook 声明前引用」的 TDZ。
      - name: 静态检查（ESLint + hook 作用域）
        run: npm run lint

      - name: 测试（账号 / 同步 / 任务清理 / 限流 / 收藏 / 同课对比）
        run: npm test

      - name: 测试（账号服务 Worker，259 项断言）
        run: npm run test:auth

      - name: 构建（构建失败同样不该放过）
        run: npm run build
