# 每次 push / PR 都跑测试。
#
# 为什么单独一个 workflow：部署工作流（deploy-pages.yml）只在**前端文件**变化时触发，
# 而 server/ 、test/ 这些改动根本不经过它 —— 也就是说改后端可以完全绕过测试。
# 这里覆盖所有分支的所有改动，并在部署工作流里也加了一道（部署前必须先过测试）。
#
# 注意：真实浏览器 e2e（tools/e2e-b6b7.mjs）需要 playwright，CI 里不装（省时间），
# 所以那条链路目前只在本地跑；纯 node 的回归都在下面这几步里。
name: CI（测试）

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 测试（账号 / 同步 / 任务清理 / 限流 / 收藏 / 同课对比）
        run: npm test

      - name: 测试（账号服务 Worker）
        run: npm run test:auth

      - name: 构建（构建失败同样不该放过）
        run: npm run build
