<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover 是必须的：下面声明了 apple-mobile-web-app-status-bar-style=black-translucent
      （加到主屏后内容要铺满整屏），而缺了 viewport-fit=cover 时 env(safe-area-inset-*) 一律返回 0 ——
      styles.css 里那几处 env() 内边距就全成了死代码，刘海 / 灵动岛 / 横屏挖孔会盖住内容。
      补上之后由 CSS 用 env() 把四边让回来（没有刘海的设备 env() = 0，桌面与安卓完全不受影响）。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10222e" />
    <meta name="description" content="回译本 · 你的私人英语工坊：看中文写英文的回译训练，AI 逐句批改并和原文对照。支持自带课文与任意 OpenAI 兼容接口。" />
    <!--
      图标：全部由 public/icon.svg 生成，改图标请改那个源文件再跑 node tools/make-icons.mjs。
      顺序有讲究 —— 支持 SVG 的浏览器优先吃第一条（矢量，任何尺寸都锐利），
      其余按 sizes 挑最合适的一档。
    -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- 主屏图标在 iOS 上默认带高光/圆角，这两个 meta 让它保持设计原样 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>回译本 · 你的私人英语工坊</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 560px; margin: 12vh auto; padding: 0 20px; font-family: system-ui, sans-serif; line-height: 1.8; color: #1c2733">
        <h1 style="font-size: 20px">需要启用 JavaScript</h1>
        <p style="color: #5b6875">回译本是一个前端交互应用（回译训练 + AI 批改），请在浏览器设置里开启 JavaScript 后重新打开本页。</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
