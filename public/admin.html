<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>运营统计 · 回译本</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Microsoft YaHei", system-ui, sans-serif; background: #f4f6fa; color: #1c2333; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 16px 56px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #7a8399; font-size: 13px; margin-bottom: 16px; }
  .tabs { display: none; gap: 8px; margin-bottom: 14px; }
  .tabs button { padding: 8px 18px; font-size: 14px; border: 1px solid #cfd6e4; border-radius: 8px; background: #fff; cursor: pointer; }
  .tabs button.on { background: #2b5cff; color: #fff; border-color: #2b5cff; }
  .gate { background: #fff; border: 1px solid #e3e8f0; border-radius: 12px; padding: 22px; }
  .gate input { width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid #cfd6e4; border-radius: 8px; }
  .gate button { margin-top: 12px; width: 100%; padding: 10px; font-size: 15px; border: 0; border-radius: 8px; background: #2b5cff; color: #fff; cursor: pointer; }
  .gate .err { color: #c0392b; font-size: 13px; margin-top: 10px; min-height: 18px; }
  .cards { display: none; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .card { background: #fff; border: 1px solid #e3e8f0; border-radius: 12px; padding: 14px 16px; }
  .card .label { color: #7a8399; font-size: 13px; }
  .card .num { font-size: 28px; font-weight: 700; margin: 4px 0 2px; }
  .card .num small { font-size: 14px; color: #7a8399; font-weight: 400; }
  .card .note { color: #98a1b3; font-size: 12px; line-height: 1.5; }
  .row { grid-column: 1 / -1; background: #fff; border: 1px solid #e3e8f0; border-radius: 12px; padding: 12px 16px; font-size: 13px; color: #4a5568; line-height: 1.9; }
  .row b { color: #1c2333; }
  .panel { display: none; }
  .chart { background: #fff; border: 1px solid #e3e8f0; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .chart .title { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .chart svg { width: 100%; height: 130px; display: block; }
  .chart .axis { display: flex; justify-content: space-between; color: #98a1b3; font-size: 11px; margin-top: 2px; }
  .filters { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; font-size: 13px; }
  .filters select { padding: 6px 8px; border: 1px solid #cfd6e4; border-radius: 8px; }
  .filters button { padding: 6px 14px; border: 1px solid #cfd6e4; border-radius: 8px; background: #fff; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e3e8f0; border-radius: 12px; overflow: hidden; font-size: 13px; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #eef1f6; }
  th { background: #f8fafd; color: #5a6478; font-weight: 600; white-space: nowrap; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.null td.num { color: #c0392b; }
  .hint { color: #98a1b3; font-size: 12px; margin: 8px 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>运营统计</h1>
  <div class="sub">仅限管理员 · 密钥在服务器 .env 的 ADMIN_KEY</div>

  <div class="gate" id="gate">
    <input id="key" type="password" placeholder="管理密钥（ADMIN_KEY）" autocomplete="off" />
    <button id="go">查看统计</button>
    <div class="err" id="err"></div>
  </div>

  <div class="tabs" id="tabs">
    <button data-tab="overview" class="on">总览</button>
    <button data-tab="trends">趋势</button>
    <button data-tab="detail">批改明细</button>
  </div>

  <div class="cards panel" id="overview">
    <div class="card"><div class="label">注册用户</div><div class="num" id="users">–</div><div class="note">今日新增 <b id="regsToday">–</b></div></div>
    <div class="card"><div class="label">累计游客（去重 IP）</div><div class="num" id="guestsTotal">–</div><div class="note">自统计上线起累计</div></div>
    <div class="card"><div class="label">今日游客</div><div class="num" id="guestsToday">–</div><div class="note">当日用公共额度的去重 IP</div></div>
    <div class="card"><div class="label">今日批改</div><div class="num" id="gradingToday">–</div><div class="note">全部方向，含自带 Key</div></div>
    <div class="card"><div class="label">累计批改</div><div class="num" id="gradingTotal">–</div><div class="note">自统计上线起累计</div></div>
    <div class="card"><div class="label">站内保留作业</div><div class="num" id="retained">–</div><div class="note">当前 KV 中保留的任务</div></div>
    <div class="row" id="meta"></div>
    <button class="refresh" id="refresh" style="grid-column:1/-1;padding:8px 18px;font-size:14px;border:1px solid #cfd6e4;border-radius:8px;background:#fff;cursor:pointer;">刷新总览</button>
  </div>

  <div class="panel" id="trends">
    <div class="filters">
      时间范围
      <select id="trendDays">
        <option value="30">最近 30 天</option>
        <option value="90" selected>最近 90 天</option>
        <option value="365">最近 365 天</option>
      </select>
      <button id="trendReload">刷新趋势</button>
    </div>
    <div class="chart"><div class="title">每日批改量</div><svg id="chartGrading" viewBox="0 0 660 130" preserveAspectRatio="none"></svg><div class="axis" id="axisGrading"></div></div>
    <div class="chart"><div class="title">每日新增用户</div><svg id="chartRegs" viewBox="0 0 660 130" preserveAspectRatio="none"></svg><div class="axis" id="axisRegs"></div></div>
    <div class="chart"><div class="title">每日游客（去重 IP）</div><svg id="chartGuests" viewBox="0 0 660 130" preserveAspectRatio="none"></svg><div class="axis" id="axisGuests"></div></div>
    <div class="hint" id="trendNote"></div>
  </div>

  <div class="panel" id="detail">
    <div class="filters">
      方向
      <select id="fDir"><option value="">全部</option><option value="cn2en">汉译英</option><option value="en2cn">英译汉</option></select>
      分数
      <select id="fScore">
        <option value="">全部</option><option value="90">90 及以上</option><option value="80">80–89</option>
        <option value="70">70–79</option><option value="60">60–69</option><option value="0">60 以下 / 无分</option>
      </select>
      <button id="csvBtn">下载 CSV</button>
    </div>
    <table>
      <thead><tr><th>时间</th><th>方向</th><th>等级</th><th class="num">分数</th><th>状态</th><th>标题</th></tr></thead>
      <tbody id="detailBody"><tr><td colspan="6">加载中…</td></tr></tbody>
    </table>
    <div class="hint" id="detailHint"></div>
  </div>
</div>
<script>
(function () {
  var KEY = 'bt-admin-key';
  var input = document.getElementById('key');
  var err = document.getElementById('err');
  var gate = document.getElementById('gate');
  var tabs = document.getElementById('tabs');
  var loaded = { overview: false, trends: false, detail: false };
  var detailRows = [];

  function savedKey() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function remember(k) { try { localStorage.setItem(KEY, k); } catch (e) {} }
  function api(path) {
    return fetch(path, { headers: { 'x-admin-key': input.value.trim() || savedKey() } })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.status === 200, status: r.status, body: j }; }); });
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  /* ---------- 总览 ---------- */
  function loadOverview() {
    return api('/api/admin/stats').then(function (r) {
      if (!r.ok) { showErr(r); return; }
      var d = r.body;
      document.getElementById('users').textContent = d.users.total;
      document.getElementById('regsToday').textContent = d.users.today || 0;
      document.getElementById('guestsTotal').textContent = d.guests.total;
      document.getElementById('guestsToday').textContent = d.guests.today;
      document.getElementById('gradingToday').textContent = d.grading.today;
      document.getElementById('gradingTotal').textContent = d.grading.total;
      document.getElementById('retained').textContent = d.jobs.retained;
      document.getElementById('meta').innerHTML =
        '统计日：<b>' + esc(d.day) + '</b>　·　今日站点 Key 代跑 <b>' + d.usage.serverKeyToday + '</b> / ' + d.usage.budget +
        '　·　历史任务总数（含OCR/出题/素材）<b>' + d.jobs.allTimeTasks + '</b>' +
        '　·　存储 <b>' + esc(d.storage.kind) + '</b>（' + d.storage.keys + ' 键）' +
        '<br>口径：' + esc(d.guests.note) + '；' + esc(d.grading.note);
      loaded.overview = true;
    });
  }

  /* ---------- 趋势 ---------- */
  function chart(svgId, axisId, series) {
    var svg = document.getElementById(svgId);
    var W = 660, H = 130, pad = 4;
    svg.innerHTML = '';
    if (!series.length) return;
    var max = 1;
    series.forEach(function (p) { if (p.n > max) max = p.n; });
    var step = (W - pad * 2) / Math.max(1, series.length - 1);
    var pts = series.map(function (p, i) {
      var x = pad + i * step;
      var y = H - 6 - (p.n / max) * (H - 22);
      return { x: x, y: y, p: p };
    });
    var ns = 'http://www.w3.org/2000/svg';
    var area = document.createElementNS(ns, 'polygon');
    area.setAttribute('points', pad + ',' + (H - 6) + ' ' + pts.map(function (q) { return q.x + ',' + q.y; }).join(' ') + ' ' + (W - pad) + ',' + (H - 6));
    area.setAttribute('fill', 'rgba(43,92,255,.12)');
    svg.appendChild(area);
    var line = document.createElementNS(ns, 'polyline');
    line.setAttribute('points', pts.map(function (q) { return q.x + ',' + q.y; }).join(' '));
    line.setAttribute('fill', 'none'); line.setAttribute('stroke', '#2b5cff'); line.setAttribute('stroke-width', '2');
    svg.appendChild(line);
    pts.forEach(function (q) {
      var c = document.createElementNS(ns, 'circle');
      c.setAttribute('cx', q.x); c.setAttribute('cy', q.y); c.setAttribute('r', 2.5); c.setAttribute('fill', '#2b5cff');
      var t = document.createElementNS(ns, 'title');
      t.textContent = q.p.day + '：' + q.p.n;
      c.appendChild(t); svg.appendChild(c);
    });
    var total = series.reduce(function (s, p) { return s + p.n; }, 0);
    document.getElementById(axisId).innerHTML =
      '<span>' + esc(series[0].day) + ' 起</span><span>合计 ' + total + ' · 峰值 ' + max + '</span><span>' + esc(series[series.length - 1].day) + '</span>';
  }

  function loadTrends() {
    var days = document.getElementById('trendDays').value;
    return api('/api/admin/trends?days=' + days).then(function (r) {
      if (!r.ok) { showErr(r); return; }
      chart('chartGrading', 'axisGrading', r.body.gradings);
      chart('chartRegs', 'axisRegs', r.body.newUsers);
      chart('chartGuests', 'axisGuests', r.body.guests);
      document.getElementById('trendNote').textContent = r.body.note || '';
      loaded.trends = true;
    });
  }

  /* ---------- 明细 ---------- */
  function scoreBucket(s) {
    if (s == null) return 'null';
    if (s >= 90) return '90'; if (s >= 80) return '80'; if (s >= 70) return '70'; if (s >= 60) return '60';
    return '0';
  }
  function dirName(d) { return d === 'cn2en' ? '汉译英' : d === 'en2cn' ? '英译汉' : (d || '–'); }
  function fmtTime(t) { if (!t) return '–'; var dt = new Date(t + 8 * 3600e3); return dt.toISOString().slice(0, 16).replace('T', ' '); }

  function renderDetail() {
    var dir = document.getElementById('fDir').value;
    var bucket = document.getElementById('fScore').value;
    var rows = detailRows.filter(function (r) {
      if (dir && r.d !== dir) return false;
      if (bucket && scoreBucket(r.s) !== bucket) return false;
      return true;
    });
    var body = document.getElementById('detailBody');
    body.innerHTML = rows.map(function (r) {
      return '<tr' + (r.s == null ? ' class="null"' : '') + '><td>' + esc(fmtTime(r.t)) + '</td><td>' + esc(dirName(r.d)) +
        '</td><td>' + esc(r.lvl || '–') + '</td><td class="num">' + (r.s == null ? '无分' : r.s) +
        '</td><td>' + esc(r.status || '–') + '</td><td>' + esc(r.title || '–') + '</td></tr>';
    }).join('') || '<tr><td colspan="6">没有匹配的记录</td></tr>';
    document.getElementById('detailHint').textContent =
      '共 ' + detailRows.length + ' 条批改（当前窗口，任务库最多保留 2000 条滚动淘汰）；筛选后 ' + rows.length + ' 条。无分 = 评分暂不可用的旧记录。';
  }
  function loadDetail() {
    return api('/api/admin/gradings?limit=1000').then(function (r) {
      if (!r.ok) { showErr(r); return; }
      detailRows = r.body.rows || [];
      renderDetail();
      loaded.detail = true;
    });
  }
  document.getElementById('csvBtn').addEventListener('click', function () {
    var dir = document.getElementById('fDir').value;
    var bucket = document.getElementById('fScore').value;
    var rows = detailRows.filter(function (r) {
      if (dir && r.d !== dir) return false;
      if (bucket && scoreBucket(r.s) !== bucket) return false;
      return true;
    });
    var csv = '\uFEFF时间,方向,等级,分数,状态,标题\n' + rows.map(function (r) {
      return [fmtTime(r.t), dirName(r.d), r.lvl || '', r.s == null ? '' : r.s, r.status || '', '"' + String(r.title || '').replace(/"/g, '""') + '"'].join(',');
    }).join('\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = '批改明细.csv'; a.click();
  });
  document.getElementById('fDir').addEventListener('change', renderDetail);
  document.getElementById('fScore').addEventListener('change', renderDetail);

  /* ---------- 鉴权与页签 ---------- */
  function showErr(r) {
    gate.style.display = 'block';
    document.getElementById('cards').style.display = 'none';
    tabs.style.display = 'none';
    err.textContent = r.body && r.body.error ? r.body.error : ('请求失败 ' + r.status);
  }
  function activate(tab) {
    ['overview', 'trends', 'detail'].forEach(function (t) {
      document.getElementById(t).style.display = t === tab ? (t === 'overview' ? 'grid' : 'block') : 'none';
    });
    Array.prototype.forEach.call(tabs.querySelectorAll('button'), function (b) { b.classList.toggle('on', b.dataset.tab === tab); });
    var job = tab === 'overview' ? (loaded.overview ? Promise.resolve() : loadOverview())
      : tab === 'trends' ? loadTrends() : loadDetail();
    return job;
  }
  Array.prototype.forEach.call(tabs.querySelectorAll('button'), function (b) {
    b.addEventListener('click', function () { activate(b.dataset.tab); });
  });
  document.getElementById('trendReload').addEventListener('click', loadTrends);
  document.getElementById('trendDays').addEventListener('change', loadTrends);
  document.getElementById('refresh').addEventListener('click', loadOverview);

  function enter() {
    gate.style.display = 'none';
    tabs.style.display = 'flex';
    activate('overview');
  }
  function tryKey(k) {
    err.textContent = '';
    input.value = k;
    return api('/api/admin/stats').then(function (r) {
      if (!r.ok) { gate.style.display = 'block'; err.textContent = r.body && r.body.error ? r.body.error : '请求失败 ' + r.status; return; }
      remember(k);
      loaded.overview = true;
      var d = r.body;
      document.getElementById('users').textContent = d.users.total;
      document.getElementById('regsToday').textContent = d.users.today || 0;
      document.getElementById('guestsTotal').textContent = d.guests.total;
      document.getElementById('guestsToday').textContent = d.guests.today;
      document.getElementById('gradingToday').textContent = d.grading.today;
      document.getElementById('gradingTotal').textContent = d.grading.total;
      document.getElementById('retained').textContent = d.jobs.retained;
      document.getElementById('meta').innerHTML =
        '统计日：<b>' + esc(d.day) + '</b>　·　今日站点 Key 代跑 <b>' + d.usage.serverKeyToday + '</b> / ' + d.usage.budget +
        '　·　历史任务总数（含OCR/出题/素材）<b>' + d.jobs.allTimeTasks + '</b>' +
        '　·　存储 <b>' + esc(d.storage.kind) + '</b>（' + d.storage.keys + ' 键）' +
        '<br>口径：' + esc(d.guests.note) + '；' + esc(d.grading.note);
      enter();
    }).catch(function (e) { err.textContent = '网络错误：' + e.message; });
  }
  document.getElementById('go').addEventListener('click', function () { tryKey(input.value.trim()); });
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryKey(input.value.trim()); });
  var saved = savedKey();
  if (saved) tryKey(saved);
})();
</script>
</body>
</html>
